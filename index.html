<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pmTomato</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🍅</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body data-phase="work">
  <main>
    <header>
      <h1>🍅 pmTomato</h1>
      <p class="sub">Work at :00 and :30. Break at :25 and :55. Music follows.</p>
    </header>

    <section class="timer">
      <div id="phase">Work</div>
      <div id="countdown">25:00</div>
      <div class="clock"><span id="clock-label">Now</span> <span id="clock">00:00:00</span></div>
    </section>

    <section class="tracks">
      <div class="card" id="card-work">
        <h2>Work music</h2>
        <div class="source">
          <label><input type="radio" name="source-work" value="youtube"> YouTube</label>
          <label><input type="radio" name="source-work" value="file"> Audio file</label>
          <label><input type="radio" name="source-work" value="none"> Silence</label>
        </div>
        <input class="url" id="url-work" type="url" placeholder="YouTube video or playlist link" autocomplete="off">
        <div class="file">
          <label class="pick">Choose file<input id="file-work" type="file" accept="audio/*"></label>
          <span id="filename-work" class="filename"></span>
        </div>
        <label class="row"><input id="once-work" type="checkbox"> Play once</label>
        <label class="row"><input id="resume-work" type="checkbox"> Resume where it left off</label>
        <label class="row">Stop after <input id="limit-work" type="number" min="1" step="1" placeholder="∞"> seconds</label>
        <div class="player" id="player-work"></div>
      </div>

      <div class="card" id="card-break">
        <h2>Break music</h2>
        <div class="source">
          <label><input type="radio" name="source-break" value="youtube"> YouTube</label>
          <label><input type="radio" name="source-break" value="file"> Audio file</label>
          <label><input type="radio" name="source-break" value="none"> Silence</label>
        </div>
        <input class="url" id="url-break" type="url" placeholder="YouTube video or playlist link" autocomplete="off">
        <div class="file">
          <label class="pick">Choose file<input id="file-break" type="file" accept="audio/*"></label>
          <span id="filename-break" class="filename"></span>
        </div>
        <label class="row"><input id="once-break" type="checkbox"> Play once</label>
        <label class="row"><input id="resume-break" type="checkbox"> Resume where it left off</label>
        <label class="row">Stop after <input id="limit-break" type="number" min="1" step="1" placeholder="∞"> seconds</label>
        <div class="player" id="player-break"></div>
      </div>
    </section>

    <section class="controls">
      <div class="buttons">
        <button id="start">Start</button>
        <button id="stop" disabled>Stop</button>
      </div>
      <p id="status" class="status">Set both tracks, press Start. Space also starts and stops. Settings are saved as you go.</p>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
